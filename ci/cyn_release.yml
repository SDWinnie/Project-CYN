name: Build & Release Project CYN

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
      - project_cyn_setup
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop Service (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow aiohttp websockets openwakeword numpy sounddevice

      - name: Run Diagnostics Tests
        run: |
          python scripts/test_dsp_parser.py

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "CYN_Desktop_Service" `
            --add-data "web_avatar;web_avatar" `
            --add-data "backend;backend" `
            --hidden-import "pystray" `
            --hidden-import "aiohttp" `
            --hidden-import "PIL" `
            backend/cyn_tray_service.py

      - name: Compress Windows Artifacts
        run: |
          Compress-Archive -Path dist/CYN_Desktop_Service -DestinationPath dist/CYN_Desktop_Service_Windows.zip

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: CYN-Windows-Desktop-Service
          path: dist/CYN_Desktop_Service_Windows.zip

  build-android:
    name: Build Android Companion (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android_companion/gradlew || true

      - name: Build Android APK
        run: |
          cd android_companion
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CYN-Android-Companion-APK
          path: android_companion/app/build/outputs/apk/**/*.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: CYN-Windows-Desktop-Service
          path: release_assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: CYN-Android-Companion-APK
          path: release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          name: "Project CYN ${{ github.ref_name }}"
          generate_release_notes: true
